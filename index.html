<script>
const UNITS = [
{ id:"u1", n:1, name:"People", pages:"pp. 9–20", dates:"Oct 26 – Nov 9", lessons:"Lessons 4–7",
grammarSum:"be: questions & answers · possessive ’s · my, your, his, her…",
vocab:{
groups:[
{title:"Family", words:["mother","father","parents","brother","sister","son","daughter","husband","wife","grandmother","grandfather","aunt","uncle","cousin","twins","children"]},
{title:"Personal information", words:["first name","surname","age","address","job","nationality","married","single","email address","phone number"]},
{title:"Everyday verbs", words:["live","work","study","teach","speak","start","finish","have"]},
{title:"Word focus: in", words:["in Mardin","in the morning","in May","in 2015","in English","in the photo"]}
],
ex:[
{t:"mcq", q:"My mother’s brother is my ___.", o:["uncle","cousin","nephew"], a:"uncle"},
{t:"mcq", q:"My uncle’s son is my ___.", o:["cousin","brother","grandson"], a:"cousin"},
{t:"mcq", q:"My father’s mother is my ___.", o:["grandmother","aunt","sister"], a:"grandmother"},
{t:"mcq", q:"Elif and Esra have the same birthday. They are ___.", o:["twins","cousins","parents"], a:"twins"},
{t:"mcq", q:"Leyla isn’t married. She’s ___.", o:["single","husband","alone"], a:"single"},
{t:"mcq", q:"I ___ English to children in a village school.", o:["teach","learn","study"], a:"teach"},
{t:"mcq", q:"“What’s your ___?” “Özdemir.”", o:["surname","first name","address"], a:"surname"},
{t:"mcq", q:"I start work at 8.30 ___ the morning.", o:["in","on","at"], a:"in"},
{t:"type", q:"Word roots: grand + daughter = ___", a:["granddaughter"]},
{t:"type", q:"Word roots: grand + parents = ___", a:["grandparents"]}
]},
grammar:{
rule:`<div class="rulegrid">
<div><h4>be: questions</h4><p><b>Are</b> you a teacher? — Yes, I <b>am</b>. / No, I’m <b>not</b>.</p><p><b>Is</b> she married? — Yes, she <b>is</b>. / No, she <b>isn’t</b>.</p><p>Where <b>are</b> your parents from?</p></div>
<div><h4>Possessive ’s</h4><p>Ali<b>’s</b> wife = the wife of Ali</p><p>my brother<b>s’</b> names (two brothers)</p><p>the children<b>’s</b> books</p></div>
<div><h4>Possessive adjectives</h4><p>I → <b>my</b> · you → <b>your</b> · he → <b>his</b> · she → <b>her</b></p><p>it → <b>its</b> · we → <b>our</b> · they → <b>their</b></p></div>
</div>
<p class="tip">Be careful: <b>its</b> (possessive) ≠ <b>it’s</b> (it is) · <b>their</b> ≠ <b>there</b> ≠ <b>they’re</b></p>`,
ex:[
{t:"mcq", q:"___ your parents teachers?", o:["Are","Is","Do"], a:"Are"},
{t:"mcq", q:"Where ___ your school?", o:["is","are","does"], a:"is"},
{t:"mcq", q:"This is Ali and ___ wife, Ayşe.", o:["his","her","their"], a:"his"},
{t:"mcq", q:"Ayşe and Ali live in Batman. ___ children are at university.", o:["Their","There","They’re"], a:"Their"},
{t:"mcq", q:"Is this ___ book?", o:["Elif’s","Elifs","Elifs’"], a:"Elif’s"},
{t:"mcq", q:"I have two brothers. My ___ names are Can and Deniz.", o:["brothers’","brother’s","brothers"], a:"brothers’", why:"Two brothers → brothers’ (the apostrophe comes after the s)."},
{t:"mcq", q:"My cat is small. ___ name is Pamuk.", o:["Its","It’s","It"], a:"Its"},
{t:"mcq", q:"Choose the correct sentence.", o:["My sister’s name is Zehra.","My sister name is Zehra.","My sisters name’s Zehra."], a:"My sister’s name is Zehra."},
{t:"mcq", q:"“Are you from Siirt?” “Yes, ___.”", o:["I am","I’m","I’m from"], a:"I am", why:"No short form at the end of a positive short answer: Yes, I am."},
{t:"order", w:["is","what","job","your","mother’s","?"], a:"What is your mother’s job?"},
{t:"order", w:["are","old","how","children","your","?"], a:"How old are your children?"},
{t:"type", q:"Possessive adjective: we → ___", a:["our"]},
{t:"type", q:"Possessive adjective: they → ___", a:["their"]}
]},
reading:{
title:"A Scientist from Mardin", person:"Aziz Sancar",
text:[
"Aziz Sancar is a famous scientist. He is from Turkey. He was born in 1946 in Savur, a small town in Mardin.",

const $ = (s, r = document) => r.querySelector(s);

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SKILLS = [["vocabulary","Vocabulary"],["grammar","Grammar"],["reading","Reading"],["listening","Listening"],["writing","Writing"]];
const store = {
get(k, d) { try { const v = localStorage.getItem("bte-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

};
let progress = store.get("progress", {});
const saveProgress = () => store.set("progress", progress);

const FEM = /female|woman|samantha|karen|moira|tessa|serena|fiona|victoria|kate|susan|martha|hazel|zira|libby|sonia|jenny|aria|natasha|catherine|allison|ava|joanna|amy|emma|salli|kimberly|kendra|ivy|stephanie|shelley|sandy|flo|olivia|mia|clara|maisie|abbi|bella|hollie|emily|michelle|mary|heera|veena|karen|sara|nora|ellen|linda|siri female|google uk english female/i;
const AGENTS = { nez: { name: "Nez", key: "voice-nez" }, didi: { name: "Didi", key: "voice-didi" } };
let voices = [], femVoices = [];
const voiceName = { nez: store.get("voice-nez", ""), didi: store.get("voice-didi", "") };
const isFem = v => FEM.test(v.name) && !/\bmale\b/i.test(v.name.replace(/female/ig, ""));
function loadVoices() {
try { voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); } catch (e) { voices = []; }
const rank = v => (/en-GB/i.test(v.lang) ? 0 : /en-(US|AU|IE|CA)/i.test(v.lang) ? .3 : 1) + (v.localService ? 0 : .5);
femVoices = voices.filter(isFem).sort((a, b) => rank(a) - rank(b));
const pool = femVoices.length ? femVoices : voices;
if (!voices.some(v => v.name === voiceName.nez)) voiceName.nez = (pool[0] || {}).name || "";
if (!voices.some(v => v.name === voiceName.didi)) voiceName.didi = (pool.find(v => v.name !== voiceName.nez) || pool[0] || {}).name || "";
document.querySelectorAll("select.voicesel").forEach(fillVoiceSel);
}
function fillVoiceSel(sel) {
const ag = sel.dataset.agent || "nez";
if (!voices.length) { sel.innerHTML = "<option>Device voice</option>"; return; }
const opt = v => `<option value="${esc(v.name)}">${esc(v.name)} (${v.lang})</option>`;
const others = voices.filter(v => !isFem(v));
sel.innerHTML = (femVoices.length ? `<optgroup label="Female voices">${femVoices.map(opt).join("")}</optgroup>` : "") + (others.length ? `<optgroup label="${femVoices.length ? "Other voices" : "Voices"}">${others.map(opt).join("")}</optgroup>` : "");
sel.value = voiceName[ag];
}
document.addEventListener("change", e => {
const s = e.target; if (!s.matches("select.voicesel")) return;
const ag = s.dataset.agent || "nez"; voiceName[ag] = s.value; store.set(AGENTS[ag].key, s.value);
document.querySelectorAll(`select.voicesel[data-agent="${ag}"]`).forEach(x => x.value = s.value);
speak(`Hello, I'm ${AGENTS[ag].name}, your speaking partner.`, .9, ag);
});
try { loadVoices(); speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch (e) {}
const agentVoice = ag => voices.find(v => v.name === voiceName[ag]) || null;
let speakToken = 0;
function stopSpeech() { speakToken++; try { speechSynthesis.cancel(); } catch (e) {} document.querySelectorAll(".playing").forEach(p => p.classList.remove("playing")); document.querySelectorAll(".script .now").forEach(n => n.classList.remove("now")); }
function utter(text, rate = .9, ag = "nez") {
const u = new SpeechSynthesisUtterance(text); const v = agentVoice(ag);
if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
const fem = v ? isFem(v) : false, same = voiceName.nez && voiceName.nez === voiceName.didi;
u.pitch = (fem ? 1 : 1.3) + (ag === "didi" && same ? .2 : 0);
u.rate = rate; return u;
}
function speak(text, rate, ag) { stopSpeech(); try { speechSynthesis.speak(utter(text, rate || .9, ag || "nez")); } catch (e) {} }
function speakSeq(parts, rate, onPart, onEnd, ag) {
stopSpeech(); const tok = speakToken; let i = 0;
const next = () => {
if (tok !== speakToken) return;
if (i >= parts.length) { onEnd && onEnd(); return; }
onPart && onPart(i);
try { const u = utter(parts[i], rate, ag || "nez"); u.onend = () => { i++; setTimeout(next, 120); }; u.onerror = () => { if (tok === speakToken) onEnd && onEnd(); }; speechSynthesis.speak(u); } catch (e) { onEnd && onEnd(); }
};
next();
}
const splitSentences = t => t.match(/[^.!?]+[.!?]+["”’]?|[^.!?]+$/g).map(s => s.trim()).filter(Boolean);
const sayBtn = (t, label = "Listen", ag = "nez") => `<button class="say" data-say="${esc(t)}" data-agent="${ag}">${SPK}${label}</button>`;
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say, .9, b.dataset.agent || "nez"); });

function block(items, key, title) {
const wrap = document.createElement("div"); wrap.className = "stack";
let right = 0, answered = 0; const total = items.length;
if (title) wrap.insertAdjacentHTML("beforeend", `<h3>${title}</h3>`);
const list = document.createElement("div"); list.className = "ex"; wrap.appendChild(list);
const score = document.createElement("div"); score.className = "score";
score.innerHTML = `<span>Score</span><strong>0 / ${total}</strong><button class="btn ghost">Try again</button>`;
const upd = () => {
score.querySelector("strong").textContent = `${right} / ${total}` + (answered === total ? (right === total ? " · Excellent!" : right >= total * .7 ? " · Well done!" : " · Keep practising") : "");
if (answered === total) { const p = progress[key]; if (!p || right >= p.r) { progress[key] = { r: right, t: total }; combineListening(key); saveProgress(); refreshTicks(); } }
};
const done = ok => { answered++; if (ok) right++; upd(); };
score.querySelector("button").onclick = () => { const nb = block(items, key, title); wrap.replaceWith(nb); };
items.forEach((it, k) => list.appendChild(itemEl(it, k + 1, done)));
wrap.appendChild(score);
return wrap;
}
function combineListening(key) {
const m = key.match(/^(u\d)-listening-[ab]$/); if (!m) return;
const A = progress[m[1] + "-listening-a"], B = progress[m[1] + "-listening-b"];
if (A && B) progress[m[1] + "-listening"] = { r: A.r + B.r, t: A.t + B.t };
}
function itemEl(it, n, done) {
const d = document.createElement("div"); d.className = "item";
if (it.t === "mcq") {
d.innerHTML = `<div class="q"><span class="n">${n}</span><span class="t">${it.q.replace("___", '<span class="gap">&nbsp;</span>')}</span></div><div class="opts"></div><p class="fb" hidden></p>`;
const opts = $(".opts", d), fb = $(".fb", d); let wrong = false;
shuffle(it.o).forEach(o => {
const b = document.createElement("button"); b.className = "opt"; b.textContent = o;
b.onclick = () => {
if (o === it.a) {
opts.querySelectorAll(".opt").forEach(x => x.disabled = true); b.classList.add("ok"); d.classList.add("right");
const g = $(".gap", d); if (g) g.textContent = o;
fb.hidden = false; fb.className = "fb good"; fb.textContent = (wrong && it.why ? it.why + " " : "") + "Correct!"; done(!wrong);
} else { wrong = true; b.classList.add("no"); b.disabled = true; fb.hidden = false; fb.className = "fb bad"; fb.textContent = it.why || "Not quite. Try again."; }
};
opts.appendChild(b);
});
} else if (it.t === "type" || it.t === "join") {
d.innerHTML = `<div class="q"><span class="n">${n}</span><span class="t">${it.q}</span></div><div class="row"><input class="tin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn">Check</button></div><p class="fb" hidden></p>`;
const inp = $("input", d), btn = $("button", d), fb = $(".fb", d); let tries = 0, fin = false;
const answers = Array.isArray(it.a) ? it.a : [it.a];
const check = () => {
if (fin) return; const v = inp.value.trim(); if (!v) { fb.hidden = false; fb.className = "fb bad"; fb.textContent = "Write your answer first."; return; }
let ok = answers.some(a => norm(a) === norm(v)), note = "";
if (!ok && it.t === "join") { const noComma = s => norm(s).replace(/,/g, ""); if (answers.some(a => noComma(a) === noComma(v))) { ok = true; note = " Tip: put a comma before the joining word."; } }
if (ok && it.t === "join" && !/^[A-Z]/.test(v)) note += " Start with a capital letter.";
if (ok) { fin = true; inp.disabled = true; btn.disabled = true; d.classList.add("right"); fb.hidden = false; fb.className = "fb good"; fb.textContent = "Correct!" + note; done(tries === 0); }
else { tries++; fb.hidden = false; fb.className = "fb bad";
if (tries >= 2) { fin = true; inp.disabled = true; btn.disabled = true; d.classList.add("shown"); fb.innerHTML = `The answer is: <b>${esc(answers[0])}</b>`; done(false); }
else fb.textContent = "Not quite. Check your spelling and try again."; }
};
btn.onclick = check; inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
} else if (it.t === "order") {
d.innerHTML = `<div class="q"><span class="n">${n}</span><div class="build"></div></div><div class="opts"></div><div class="row"><button class="btn ghost" data-a="clear">Clear</button><button class="btn" data-a="check">Check</button></div><p class="fb" hidden></p>`;
const build = $(".build", d), pool = $(".opts", d), fb = $(".fb", d); let picked = [], tries = 0, fin = false;
shuffle(it.w).forEach(w => {
const c = document.createElement("button"); c.className = "wchip"; c.textContent = w;
c.onclick = () => { if (fin) return; c.classList.add("used"); picked.push(c); build.insertAdjacentHTML("beforeend", `<span class="wchip">${esc(w)}</span>`); };
pool.appendChild(c);
});
$("[data-a=clear]", d).onclick = () => { if (fin) return; picked.forEach(c => c.classList.remove("used")); picked = []; build.innerHTML = ""; fb.hidden = true; };
$("[data-a=check]", d).onclick = () => {
if (fin) return; fb.hidden = false;
if (picked.length < it.w.length) { fb.className = "fb bad"; fb.textContent = "Use all the words."; return; }
let s = picked.map(c => c.textContent).join(" ").replace(/ ([?.!])$/, "$1"); s = s[0].toUpperCase() + s.slice(1);
if (norm(s) === norm(it.a)) { fin = true; d.classList.add("right"); fb.className = "fb good"; fb.innerHTML = `Correct! ${esc(it.a)} ${sayBtn(it.a, "")}`; done(tries === 0); }
else { tries++; fb.className = "fb bad";
if (tries >= 2) { fin = true; d.classList.add("shown"); fb.innerHTML = `The answer is: <b>${esc(it.a)}</b> ${sayBtn(it.a, "")}`; done(false); }
else fb.textContent = "Not quite. Tap Clear and try again."; }
};
}
return d;
}

function renderAI(r) {
r = r || {}; const s = r.scores || {};
const meter = (l, v) => { v = Math.max(0, Math.min(5, Math.round(+v || 0))); return `<div class="meter"><div class="row" style="justify-content:space-between"><b>${l}</b><span class="small">${v} / 5</span></div><div class="pips">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= v ? "on" : ""}"></i>`).join("")}</div></div>`; };
const list = a => Array.isArray(a) && a.length ? `<ul class="plain">${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
const corr = Array.isArray(r.corrections) ? r.corrections.filter(c => c && c.original) : [];
return `<div class="card ai"><p class="lbl">Feedback from Claude</p>
${r.overall ? `<p style="font-size:17px">${esc(r.overall)}</p>` : ""}
<div class="meters">${meter("Language", s.language)}${meter("Vocabulary", s.vocabulary)}${meter("Organisation", s.organisation)}</div>
${list(r.strengths) ? `<div><h4>What’s good</h4>${list(r.strengths)}</div>` : ""}
${corr.length ? `<div><h4>Corrections</h4><div class="tblwrap"><table class="corr"><tr><th>You wrote</th><th>Better</th><th>Why</th></tr>${corr.map(c => `<tr><td class="o">${esc(c.original)}</td><td class="c">${esc(c.correct || "")}</td><td>${esc(c.why || "")}</td></tr>`).join("")}</table></div></div>` : `<p>No important grammar mistakes. Well done!</p>`}
${list(r.vocabulary_tips) ? `<div><h4>Vocabulary</h4>${list(r.vocabulary_tips)}</div>` : ""}
${r.organisation_tip ? `<div><h4>Organisation</h4><p>${esc(r.organisation_tip)}</p></div>` : ""}
${r.next_step ? `<p class="tip"><b>Next step:</b> ${esc(r.next_step)}</p>` : ""}
<p class="small">Feedback from Claude can make mistakes. Ask your teacher if something is not clear.</p></div>`;
}

function renderLab() {
const wrap = document.createElement("div"); wrap.className = "stack"; wrap.style.setProperty("--c", "var(--lab)"); wrap.style.gap = "22px";
wrap.innerHTML = `
<div class="uhead"><div class="row" style="gap:16px;align-items:flex-end"><span class="big">S</span><div><p class="lbl">All units</p><h2>Sentence Lab</h2></div></div></div>
<div class="card"><div class="rulegrid">
<div><h4>Simple sentence</h4><p>One subject + one verb group = one idea.</p><p><b>Elif teaches</b> English.</p><p><b>Hasan and Gül live</b> in Siirt.</p><p><b>I get up</b> at six and <b>go</b> to work.</p></div>
<div><h4>Compound sentence</h4><p>Two simple sentences + <b>, and · , but · , so · , or</b></p><p>Elif teaches English<b>, and</b> her husband is a nurse.</p><p>I’m tired<b>, so</b> I go to bed early.</p></div>
<div><h4>Which joining word?</h4><p><b>and</b> = add information</p><p><b>but</b> = a contrast</p><p><b>so</b> = a result</p><p><b>or</b> = a choice</p></div>
</div>
<p class="tip">Don’t join two sentences with only a comma: <s>I like tea, I don’t like coffee.</s> → I like tea<b>, but</b> I don’t like coffee. Good writers mix short simple sentences and compound sentences.</p></div>
<div id="b1"></div><div id="b2"></div><div id="b3"></div><div id="b4"></div>
<div class="card"><h3>Write your own</h3><p class="muted">Write one compound sentence about you for each joining word.</p><div class="lab-own" id="own"></div></div>`;
view.appendChild(wrap);
$("#b1", wrap).replaceWith(block(LAB.simple, "lab-simple", "1 · Simple or compound?"));
$("#b2", wrap).replaceWith(block(LAB.conj, "lab-conj", "2 · Choose and, but, so or or"));
$("#b3", wrap).replaceWith(block(LAB.join, "lab-join", "3 · Join the sentences"));
$("#b4", wrap).replaceWith(block(LAB.fix, "lab-fix", "4 · Find the correct sentence"));
const own = $("#own", wrap);
["and", "but", "so"].forEach(c => {
const d = document.createElement("div"); d.className = "item";
const ex = { and: "I teach in Siirt, and my sister teaches in Batman.", but: "My flat is small, but it’s very comfortable.", so: "I love music, so I sing with my students." }[c];
d.innerHTML = `<label class="q" for="own-${c}"><span class="n"><b style="color:var(--lab)">${c}</b></span><span class="t small">Example: ${ex}</span></label><div class="row"><input class="tin" id="own-${c}" autocomplete="off"><button class="btn">Check</button></div><p class="fb" hidden></p>`;
const inp = $("input", d), fb = $(".fb", d), saved = store.get("own-" + c, ""); inp.value = saved;
$("button", d).onclick = () => {
const v = inp.value.trim(); store.set("own-" + c, v); const tips = [];
const m = v.match(new RegExp(`^(.+?)(,?)\\s+${c}\\s+(.+)$`, "i"));
if (!m) tips.push(`Use <b>${c}</b> to join two ideas.`);
else { if (!m[2]) tips.push(`Put a comma before <b>${c}</b>.`); if (m[1].trim().split(/\s+/).length < 2 || m[3].trim().split(/\s+/).length < 2) tips.push("Each part needs a subject and a verb."); }
if (!/^[A-Z]/.test(v)) tips.push("Start with a capital letter.");
if (!/[.!?]$/.test(v)) tips.push("End with a full stop.");
fb.hidden = false;
if (tips.length) { fb.className = "fb bad"; fb.innerHTML = tips.join(" "); d.classList.remove("right"); }
else { fb.className = "fb good"; fb.innerHTML = `Looks good! ${sayBtn(v, "Listen")}`; d.classList.add("right"); }
};
own.appendChild(d);
});
refreshTicks();
}

const h0 = (location.hash || "").slice(1);
go(/^(home|lab|u[1-5])(-(vocabulary|grammar|reading|listening|writing))?$/.test(h0) ? h0 : "home");

let deferredPrompt = null;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; setupInstall(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; const s = document.getElementById("install"); if (s) s.hidden = true; });
function setupInstall() {
const sec = document.getElementById("install"); if (!sec) return;
if (isStandalone()) { sec.hidden = true; return; }
const ua = navigator.userAgent || "";
const dev = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "ios" : /Android/.test(ua) ? "android" : (/Macintosh/.test(ua) && /Safari/.test(ua) && !/Chrome|Edg/.test(ua)) ? "mac" : "desktop";
sec.querySelectorAll("[data-dev]").forEach(d => d.classList.toggle("me", d.dataset.dev === dev));
const row = document.getElementById("installRow");
if (deferredPrompt) { row.hidden = false; document.getElementById("installBtn").onclick = async () => { deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) {} deferredPrompt = null; row.hidden = true; }; }
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
</script>
